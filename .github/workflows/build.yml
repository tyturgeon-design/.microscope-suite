name: Build Android APK

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Unzip Microscope Suite
      run: |
        unzip microscope_suite.zip -d app_code/
        cp -r app_code/microscope_suite/* ./ || cp -r app_code/* ./

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt install -y build-arg git ccache lib32stdc++6 lib32z1 libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev pkg-config libgl1-mesa-dev libgles2-mesa-dev python3-pip python3-setuptools python3-virtualenv git zip unzip openjdk-17-jdk autoconf libtool libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: microscope-suite-apk
        path: bin/*.apk
